<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Antigravity" />
  <meta name="theme-color" content="#0b0f19" />
  <link rel="manifest" href="/manifest.json" />
  <title>Antigravity Pocket v2.0</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --panel: #111827;
      --card: #1f2937;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent2: #8b5cf6;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --panel: #ffffff;
      --card: #f1f5f9;
      --border: rgba(15, 23, 42, 0.1);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent2: #7c3aed;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: calc(env(safe-area-inset-top, 12px) + 8px) 14px 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #10b981; }
    .dot.offline { background: #ef4444; }
    .controls { display: flex; align-items: center; gap: 6px; }
    select, .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12.5px;
      cursor: pointer;
    }
    .btn.primary { background: var(--accent); color: #fff; border: none; font-weight: 600; }
    .btn.danger { background: #ef4444; color: #fff; border: none; }
    .btn.success { background: #10b981; color: #fff; border: none; }
    .view { flex: 1; overflow-y: auto; padding: 14px; display: none; flex-direction: column; gap: 12px; }
    .view.active { display: flex; }
    .msg {
      max-width: 90%;
      padding: 11px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .msg.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); width: 100%; }
    .timeline-item {
      font-size: 12px;
      padding: 6px 10px;
      border-left: 3px solid var(--accent);
      background: var(--card);
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .approval-card {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 12px;
      padding: 12px;
      margin: 6px 0;
    }
    .card-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .composer {
      padding: 8px 12px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #prompt-input {
      flex: 1;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
    }
    nav.tabs {
      padding: 6px 8px calc(env(safe-area-inset-bottom, 10px) + 6px);
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11.5px;
      padding: 6px 4px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active { color: var(--accent); background: var(--card); }
    pre.code-preview {
      background: var(--card);
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span id="ws-dot" class="dot offline"></span>
      <span id="header-title">Antigravity Pocket</span>
    </div>
    <div class="controls">
      <select id="mode-select" onchange="changePermissionMode(this.value)" title="Mode de permission">
        <option value="read_only">🔒 Read-only</option>
        <option value="assisted" selected>🛡️ Assisted</option>
        <option value="autonomous">⚡ Autonomous</option>
      </select>
      <button class="btn danger" id="cancel-btn" onclick="cancelActiveTurn()" style="display:none">⏹ Stop</button>
      <button class="btn" onclick="toggleTheme()">🌓</button>
      <button class="btn" onclick="promptLogin()">🔑</button>
    </div>
  </header>

  <!-- TAB 1: CHAT & TIMELINE -->
  <section id="view-chat" class="view active">
    <div id="chat-stream" style="display:flex;flex-direction:column;gap:10px;"></div>
  </section>

  <!-- TAB 2: SESSIONS -->
  <section id="view-sessions" class="view">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>Sessions & Projets</strong>
      <button class="btn primary" onclick="createNewSession()">+ Nouvelle Session</button>
    </div>
    <div id="sessions-list" style="display:flex;flex-direction:column;gap:8px;"></div>
  </section>

  <!-- TAB 3: WORKSPACE FILE MANAGER -->
  <section id="view-files" class="view">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>Explorateur Workspace</strong>
      <div>
        <input type="file" id="upload-input" multiple style="display:none" onchange="uploadFiles(this.files)" />
        <button class="btn primary" onclick="document.getElementById('upload-input').click()">📎 Envoyer</button>
      </div>
    </div>
    <div id="files-list" style="display:flex;flex-direction:column;gap:8px;"></div>
    <div id="file-preview-box" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong id="preview-title">Aperçu</strong>
        <button class="btn" onclick="document.getElementById('file-preview-box').style.display='none'">Fermer</button>
      </div>
      <pre id="preview-content" class="code-preview"></pre>
    </div>
  </section>

  <!-- TAB 4: APPROVALS -->
  <section id="view-approvals" class="view">
    <strong>Validation des Opérations Sensibles</strong>
    <div id="approvals-list" style="display:flex;flex-direction:column;gap:8px;"></div>
  </section>

  <div class="composer">
    <button class="btn" onclick="sendQuick('start')">⚡ start</button>
    <input id="prompt-input" type="text" placeholder="Instruction pour l'agent..." onkeydown="if(event.key==='Enter') sendPrompt()" />
    <button class="btn primary" onclick="sendPrompt()">Envoyer</button>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('chat', this)">💬 Chat</button>
    <button class="tab-btn" onclick="switchTab('sessions', this)">🗂️ Sessions</button>
    <button class="tab-btn" onclick="switchTab('files', this)">📁 Workspace</button>
    <button class="tab-btn" onclick="switchTab('approvals', this)">🛡️ Approvals</button>
  </nav>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

    let currentSessionId = localStorage.getItem("agy_session_id") || "";
    let lastSequence = 0;
    let ws = null;
    let activeTurnBubble = null;

    function getToken() { return localStorage.getItem("agy_token") || ""; }
    function authHeaders() {
      const h = { "Content-Type": "application/json" };
      if (getToken()) h["Authorization"] = `Bearer ${getToken()}`;
      return h;
    }

    function haptic(ms = 25) {
      if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e) {} }
    }

    function toggleTheme() {
      const root = document.documentElement;
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
    }

    async function promptLogin() {
      const pwd = prompt("Mot de passe du serveur (APP_PASSWORD) :");
      if (pwd === null) return;
      const res = await fetch("/api/v1/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pwd.trim() })
      });
      if (res.ok) {
        const data = await res.json();
        localStorage.setItem("agy_token", data.token);
        await initSessionAndConnect();
      } else {
        alert("Mot de passe invalide.");
      }
    }

    function switchTab(name, btn) {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById(`view-${name}`).classList.add("active");
      btn.classList.add("active");
      if (name === "sessions") loadSessions();
      if (name === "files") loadFiles();
      if (name === "approvals") loadApprovals();
    }

    async function initSessionAndConnect() {
      const res = await fetch("/api/v1/sessions", { headers: authHeaders() });
      if (res.status === 401) return;
      const data = await res.json();
      if (data.sessions && data.sessions.length > 0) {
        const found = data.sessions.find(s => s.session_id === currentSessionId) || data.sessions[0];
        selectSession(found.session_id, found.title, found.permission_mode);
      } else {
        await createNewSession("Session Principale");
      }
    }

    async function createNewSession(defaultTitle) {
      const title = defaultTitle || prompt("Nom de la nouvelle session :", "Nouvelle tâche") || "Session";
      const mode = document.getElementById("mode-select").value;
      const res = await fetch("/api/v1/sessions", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ title, permission_mode: mode })
      });
      if (res.ok) {
        const data = await res.json();
        selectSession(data.session.session_id, data.session.title, data.session.permission_mode);
        loadSessions();
      }
    }

    function selectSession(sessionId, title, mode) {
      currentSessionId = sessionId;
      localStorage.setItem("agy_session_id", sessionId);
      document.getElementById("header-title").textContent = title || "Antigravity Pocket";
      if (mode) document.getElementById("mode-select").value = mode;
      document.getElementById("chat-stream").innerHTML = "";
      lastSequence = 0;
      activeTurnBubble = null;
      connectWebSocket();
    }

    function connectWebSocket() {
      if (!currentSessionId) return;
      if (ws) { try { ws.close(); } catch(e) {} }
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const token = encodeURIComponent(getToken());
      ws = new WebSocket(`${proto}//${location.host}/ws/sessions/${currentSessionId}?token=${token}&last_seq=${lastSequence}`);
      const dot = document.getElementById("ws-dot");
      ws.onopen = () => dot.classList.remove("offline");
      ws.onclose = () => dot.classList.add("offline");
      ws.onmessage = (ev) => renderTimelineEvent(JSON.parse(ev.data));
    }

    function ensureAgentTurnContainer() {
      if (!activeTurnBubble) {
        const stream = document.getElementById("chat-stream");
        const box = document.createElement("div");
        box.className = "msg agent";
        const timeline = document.createElement("div");
        const content = document.createElement("div");
        box.appendChild(timeline);
        box.appendChild(content);
        stream.appendChild(box);
        activeTurnBubble = { box, timeline, content };
      }
      return activeTurnBubble;
    }

    function renderTimelineEvent(ev) {
      if (ev.sequence && ev.sequence > lastSequence) lastSequence = ev.sequence;
      const stream = document.getElementById("chat-stream");
      const p = ev.payload || {};

      if (ev.type === "user_message") {
        activeTurnBubble = null;
        const b = document.createElement("div");
        b.className = "msg user";
        b.textContent = p.text || "";
        stream.appendChild(b);
      } else if (ev.type === "session_started") {
        document.getElementById("cancel-btn").style.display = "inline-block";
        ensureAgentTurnContainer();
      } else if (ev.type === "thought_delta") {
        const turn = ensureAgentTurnContainer();
        turn.timeline.innerHTML = `<div class="timeline-item">🧠 Réflexion en cours...</div>`;
      } else if (ev.type === "tool_started") {
        const turn = ensureAgentTurnContainer();
        const item = document.createElement("div");
        item.className = "timeline-item";
        item.textContent = `⚙️ Outil actif : ${p.tool || "tool"} (${p.status || "running"})`;
        turn.timeline.appendChild(item);
      } else if (ev.type === "approval_required") {
        haptic(80);
        const turn = ensureAgentTurnContainer();
        const card = document.createElement("div");
        card.className = "approval-card";
        card.id = `card-${p.approval_id}`;
        card.innerHTML = `
          <div><strong>🛡️ Approbation requise (${p.tool_name})</strong></div>
          <div style="font-size:12.5px;margin:4px 0;">${p.risk_description || ""}</div>
          <div style="font-family:monospace;font-size:11.5px;opacity:0.85;">Cible : ${p.command_or_target || ""}</div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn success" onclick="resolveApproval('${p.approval_id}', true)">✅ Approuver</button>
            <button class="btn danger" onclick="resolveApproval('${p.approval_id}', false)">❌ Refuser</button>
          </div>
        `;
        turn.timeline.appendChild(card);
      } else if (ev.type === "approval_resolved") {
        const card = document.getElementById(`card-${p.approval_id}`);
        if (card) card.innerHTML = `<em>Décision enregistrée : ${p.approved ? "✅ Approuvé" : "❌ Refusé"}</em>`;
      } else if (ev.type === "assistant_message") {
        const turn = ensureAgentTurnContainer();
        turn.content.textContent += (p.delta || "");
      } else if (ev.type === "session_completed") {
        haptic(40);
        document.getElementById("cancel-btn").style.display = "none";
        activeTurnBubble = null;
      } else if (ev.type === "session_error") {
        document.getElementById("cancel-btn").style.display = "none";
        const turn = ensureAgentTurnContainer();
        turn.content.textContent += `\n❌ ${p.error || "Erreur"}`;
        activeTurnBubble = null;
      }
      stream.parentElement.scrollTop = stream.parentElement.scrollHeight;
    }

    function sendPrompt() {
      const input = document.getElementById("prompt-input");
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "prompt", prompt: text }));
      input.value = "";
    }

    function sendQuick(text) {
      document.getElementById("prompt-input").value = text;
      sendPrompt();
    }

    function cancelActiveTurn() {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "cancel" }));
    }

    async function resolveApproval(approvalId, approved) {
      await fetch(`/api/v1/approvals/${approvalId}/resolve`, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ approved })
      });
      loadApprovals();
    }

    async function changePermissionMode(mode) {
      if (!currentSessionId) return;
      await fetch(`/api/v1/sessions/${currentSessionId}`, {
        method: "PATCH",
        headers: authHeaders(),
        body: JSON.stringify({ permission_mode: mode })
      });
    }

    async function loadSessions() {
      const res = await fetch("/api/v1/sessions", { headers: authHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      const box = document.getElementById("sessions-list");
      box.innerHTML = data.sessions.map(s => `
        <div class="card-box">
          <div onclick="selectSession('${s.session_id}', '${s.title}', '${s.permission_mode}')" style="cursor:pointer;flex:1">
            <strong>${s.title}</strong>
            <div style="font-size:12px;color:var(--muted)">Mode: ${s.permission_mode} • Statut: ${s.status}</div>
          </div>
          <button class="btn danger" onclick="deleteSession('${s.session_id}')">🗑</button>
        </div>
      `).join("");
    }

    async function deleteSession(id) {
      await fetch(`/api/v1/sessions/${id}`, { method: "DELETE", headers: authHeaders() });
      loadSessions();
    }

    async function loadFiles() {
      const res = await fetch("/api/v1/files", { headers: authHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      const box = document.getElementById("files-list");
      if (!data.files.length) {
        box.innerHTML = "<em>Aucun fichier dans le workspace.</em>";
        return;
      }
      box.innerHTML = data.files.map(f => `
        <div class="card-box">
          <div>
            <strong>${f.is_dir ? "📁" : "📄"} ${f.name}</strong>
            <div style="font-size:11.5px;color:var(--muted)">${(f.size/1024).toFixed(1)} Ko</div>
          </div>
          <div style="display:flex;gap:6px;">
            ${f.previewable ? `<button class="btn" onclick="previewFile('${f.path}')">👁 Aperçu</button>` : ""}
            ${!f.is_dir ? `<a class="btn primary" style="text-decoration:none" href="/api/v1/files/download/${encodeURIComponent(f.path)}?token=${encodeURIComponent(getToken())}" download>⬇</a>` : ""}
          </div>
        </div>
      `).join("");
    }

    async function previewFile(path) {
      const res = await fetch(`/api/v1/files/preview?path=${encodeURIComponent(path)}`, { headers: authHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById("preview-title").textContent = data.name;
      document.getElementById("preview-content").textContent = data.content || "(Aperçu binaire non disponible)";
      document.getElementById("file-preview-box").style.display = "block";
    }

    async function uploadFiles(fileList) {
      if (!fileList || !fileList.length) return;
      const fd = new FormData();
      for (const f of fileList) fd.append("files", f);
      await fetch(`/api/v1/files/upload?token=${encodeURIComponent(getToken())}`, { method: "POST", body: fd });
      loadFiles();
    }

    async function loadApprovals() {
      const res = await fetch("/api/v1/approvals", { headers: authHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      const box = document.getElementById("approvals-list");
      if (!data.approvals.length) {
        box.innerHTML = "<em>Aucune demande d'approbation en attente.</em>";
        return;
      }
      box.innerHTML = data.approvals.map(a => `
        <div class="card-box">
          <div>
            <strong>${a.tool_name} (${a.status})</strong>
            <div style="font-size:12px;color:var(--muted)">${a.risk_description}</div>
          </div>
          ${a.status === "pending" ? `
            <div style="display:flex;gap:6px;">
              <button class="btn success" onclick="resolveApproval('${a.approval_id}', true)">✅</button>
              <button class="btn danger" onclick="resolveApproval('${a.approval_id}', false)">❌</button>
            </div>
          ` : ""}
        </div>
      `).join("");
    }

    initSessionAndConnect();
  </script>
</body>
</html>
