services:
  antigravity-pocket:
    build: .
    container_name: antigravity-pocket
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-ChangeMeNow!}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-replace_with_random_64_hex_secret}
      - AGY_WORKSPACE=/home/user/workspace
      - AGY_DB_PATH=/home/user/data/antigravity_pocket.db
      - AGY_DEFAULT_PERMISSION_MODE=${AGY_DEFAULT_PERMISSION_MODE:-assisted}
    volumes:
      - ./workspace:/home/user/workspace
      - ./data:/home/user/data
      - ~/.gemini:/home/user/.gemini
